protocol: residualmem_v8_discrete_wm_v1

# Frozen architecture and pre-committed budget for the formal run on the v8
# cache. Nothing here may be tuned: the point of this file is that the budget
# is fixed *before* any validation number is looked at.
#
# Architecture is the winner of worklog section 24.3 (12L/4096 + dropout 0.3,
# 33.24M parameters). Capacity above ~15M only pays once the model is
# regularised, which is why num_layers/mlp_dim differ from v8_discrete.yaml
# while everything else is unchanged.
#
# Budget is derived, not searched. The dev protocol was 31,555 fit transitions
# x 240,000 updates x batch 32 = 243.38 epochs. The formal run fits on the
# whole train split (39,365 transitions -- the 24.7% the dev protocol held out
# as its own dev set comes back), so identical exposure is 299,437 updates.
# Rounded to 300,000 so that eval_every 2500 yields exactly 120 evaluation
# points, the same count used throughout section 24; the rounding costs 0.2%
# of an epoch, far below anything measurable.
#
# (An earlier revision of this file targeted 480,000 updates for a 2x-data
# extension. That extension was abandoned: the collection environment could no
# longer reproduce v8's rendering stack -- see the worklog -- so the dataset
# stays as it is.)
#
# min_steps == max_steps disables early stopping, so all three seeds run an
# identical budget. The delivered checkpoint is last.pkl, fixed in advance --
# selecting best.pkl on validation and then bootstrapping on the same
# validation would bias the interval. Measured cost of taking the final
# checkpoint on this exact config: 9.97 bits (best 7324.62 @202k vs final
# 7334.60 @240k), under a tenth of the ~110-bit noise floor.
#
# Pre-registered prediction, recorded before the first run: validation code
# bits/transition should land in 7091-7106, from 7334.60 (dev, final
# checkpoint) - 32.80 (dev->validation difficulty, measured on the source
# baseline at fixed fit) - 196..211 (the +24.7% data, from the power law and
# from the measured source gain x the 4.02x neural/source ratio). Single-seed
# noise is ~56 (1 sigma), so 7035-7160 confirms.

model:
  num_tasks: 12
  max_history: 7
  num_latent_tokens: 64
  num_subspaces: 32
  num_categories: 256
  num_observation_slots: 64
  code_embedding_dim: 8
  d_model: 256
  num_layers: 12
  num_heads: 8
  mlp_dim: 4096
  dropout: 0.3
  action_embedding_dim: 32
  byte_embedding_dim: 16
  payload_hidden_dim: 64
  # Adopted: worth +434.76 bits (section 12 A3), independently cross-checked at
  # 387.8 by the rank screen (section 23.7).
  use_copy_gate: true
  # Falsified in section 21.3: its +60.81-bit bill is deterministic and buys no
  # measurable observation gain. Also unsupported by train.py, which does not
  # pass actions["targets"].
  use_target_channel: false
  max_payload_bytes: 40

training:
  batch_size: 32
  learning_rate: 0.0003
  warmup_steps: 1000
  max_steps: 300000
  min_steps: 300000
  eval_every: 2500
  patience_steps: 300000
  weight_decay: 0.0001
  gradient_clip: 1.0
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8
  matmul_precision: highest

evaluation:
  batch_size: 32
  bootstrap_replicates: 10000
  rollout_horizons: [1, 2, 3, 4, 5, 6, 7]

action:
  exclude_policy: true
  max_ref: 63
  payload_bytes: 40
  select_option_uses_parent: true
  structural_bill_bits: 11
  payload_length_bill_bits: 6
  task_bill_bits_per_episode: 4
