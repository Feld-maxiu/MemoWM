# Which artifact is *the* artifact.
#
# Six components were built separately; each left behind a directory of
# near-identical files. This file names one per role. `residualmem/manifest.py`
# refuses to hand back a path whose sha256 disagrees, so choosing wrong becomes
# an exception instead of a slightly different number.
#
# Every hash below was recomputed from the bytes on disk on 2026-09-02. Do not
# copy hashes out of documentation into this file -- a transcription error makes
# the manifest reject the *correct* artifact, and the symptom is indistinguishable
# from a real mismatch. Regenerate with:
#     python -m residualmem.manifest --rehash

protocol: residualmem_system_lock_v1
minted: "2026-09-02"

# $DATA is outside the repo. On this machine /home/luzheng/workspace/...,
# /mnt/data/users/luzheng/workspace/... and /mnt/workspace/users/luzheng/...
# are the same physical disk. Override with RESIDUALMEM_DATA.
data_root: /mnt/data/users/luzheng/workspace/iclr/czs/data/molmoweb-pilot

artifacts:

  # Selected arm, step 6000, val answer-CE 1.7572. Chosen by the held-out
  # observation-fidelity gap, not by CE -- hence `.gapbest`, whose twin
  # `qformer-K32e-obs0.5.pt` is the CE-selected checkpoint and is NOT this.
  # 技术报告 §4.2 / QFORMER_实验手册 §0.
  qformer:
    path: ${REPO}/outputs/instruct_bridge/v9-instruct-pca20k-balanced-xbar/qformer-K32e-obs0.5.gapbest.pt
    sha256: fb31e5ff454a8062053fa25d5bbbcdff725cbb548a1bd641f5315a7fa867d231
    note: >-
      Carries the input connector inside it under the `connector.` key prefix.
      There is no separate connector artifact in this system: the three
      $D/input-connector-*.pt files belong to the retired fixed-pooling line and
      loading one alongside this checkpoint is a hard raise
      (residualmem_instruct_adapter.py:199-204).

  # Standalone head. QFORMER_实验手册 §3.4: RESIDUALMEM_RETRIEVAL_HEAD must be set
  # explicitly, or the adapter silently falls back to the joint head baked into
  # the Q-Former checkpoint, which measures within-session R@1 0.1988 vs 0.2131.
  retrieval_head:
    path: ${REPO}/outputs/instruct_bridge/v9-instruct-pca20k-balanced-xbar/head-K32e-obs0.5-gapbest.pt
    sha256: a961e9fdf69c7325290ba69d0f8cad75e0ec3df83c31cd52062af14413f9cf74

  # The single most dangerous handoff in the system. Two fits share this
  # filename; only the pq-full/ one is bit-identical to the decoder embedded in
  # the world model's training npz. The other yields valid-looking codes, a cache
  # that builds, and ~972 bits of NLL error with nothing raising.
  codebook:
    path: ${DATA}/pq-full/opq-shared-mix10-M32-C64.npz
    sha256: bcc4c3938e0f301ef18a5224fbce1a1d66a3c50818c8f69da1b8e4159f5b2bb8
    known_wrong:
      - sha256: 658268350c8ca4c3fa49c67da12484c9c41aa64c4e30b3837ee988d1d1fe4f8a
        what: "$DATA/pq/opq-shared-mix10-M32-C64.npz -- a second k-means fit of the same config"
        why_it_matters: >-
          Centroids differ from the training decoder by 0.40 on average
          (max 47.3). Per-position TV distance median 0.335 against the correct
          0.000. The model will train and score without complaint and every
          number will be wrong by roughly 972 bits. See WM_MIXED_复现手册 §3.3.

  # Kept, not deleted, and deliberately locked: UTILITY_GATE.md §4.4 rests a
  # falsifiable prediction on it (a coarser codebook should leave the mask less
  # to remove than C=64's 16.8%). Not run as of this minting.
  codebook_coarse:
    path: ${DATA}/pq/opq-shared-mix10-M32-C16.npz
    sha256: 762ffac45e96d1401686e3d8a29c73b9a7449b701f003b090465e8e8f2fad12a

  # 60,000 steps, dropout 0.1. run/run.json best_selection.code_bits_per_transition
  # = 5182.83124384419 over 817 transitions; that number is the cross-check every
  # downstream stage must reproduce. best.pkl and last.pkl are byte-identical here
  # (best == last @ 60000), but the v8 line preregistered `last.pkl` to remove
  # selection optimism, so both are kept.
  world_model:
    path: ${REPO}/run/best.pkl
    sha256: e8ab2922fa642cd01cf40f80f30a46fdde0f69127dc6a6ca66713f9f0466bd6b

  # Produced by experiments/utility_gate/export_mask.py from 86,400 labels across
  # three files; all 1024 positions covered. Self-checked at export: full-send
  # over all 817 states reproduces the world model's 5182.83124384419 to 1.0e-05
  # (float32 storage, not a disagreement), and the gate reads 4311.96 -- 16.80%
  # saved, keep 0.8359, 1.425x against fixed width.
  #
  # Ships the utility vector and lambda, NOT a boolean mask: the decision is per
  # state (drop j iff |U_j| < lambda * H_j) and H_j is recomputed decoder-side,
  # so the gate costs zero mask bits.
  #
  # The mask is bound to the WMA fit-corpus question distribution. Fitting it on
  # generated questions measurably worsened it on WMA questions
  # (UTILITY_GATE.md §7.4). That warning is also inside the npz metadata.
  utility_mask:
    path: ${REPO}/gate/mask-lambda0.0010.npz
    sha256: 4edd12a24d2072e43d2f01a3d0297b18fbed37fb6d9fe58be3999b07ef68f511
    produced_by: experiments/utility_gate/export_mask.py
